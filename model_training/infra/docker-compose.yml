# model_training/infra/docker-compose.yml
# Infrastructure for the training workflow: an S3-compatible object store, data versioning
# (LakeFS) on top of it, and experiment tracking / model registry (MLflow).
#
# Object store: the bundled SeaweedFS runs only with the profile "local-s3":
#   docker compose --profile local-s3 up -d --wait
# To use an existing S3 (AWS, a company endpoint), set S3_* in infra/.env and start
# without the profile; no code changes are needed.
# Licences: SeaweedFS Apache-2.0, LakeFS 1.86.0 Apache-2.0 (last release before the
# Business Source License), MLflow Apache-2.0.
services:
  seaweedfs:
    profiles: ["local-s3"]
    image: chrislusf/seaweedfs:4.47
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<JSON
        {"identities": [{"name": "admin",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY_ID}", "secretKey": "$${S3_SECRET_ACCESS_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        JSON
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-seaweedadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-seaweedadmin-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  lakefs:
    image: treeverse/lakefs:1.86.0
    user: "0:0"   # the named volume's mount point is root-owned on some hosts
    depends_on:
      seaweedfs:
        condition: service_healthy
        required: false   # absent when an external S3 is used
    environment:
      LAKEFS_DATABASE_TYPE: local
      LAKEFS_BLOCKSTORE_TYPE: s3
      # Unset S3_* use the bundled SeaweedFS; an empty S3_ENDPOINT means AWS.
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: ${S3_ENDPOINT-http://seaweedfs:8333}
      LAKEFS_BLOCKSTORE_S3_REGION: ${S3_REGION:-us-east-1}
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID-seaweedadmin}
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY-seaweedadmin-secret}
      # Host-run clients (lakectl local, boto3) download through presigned URLs, which must
      # name an address the host can reach; with an external S3 this is its public endpoint.
      LAKEFS_BLOCKSTORE_S3_PRE_SIGNED_ENDPOINT: ${S3_PRESIGNED_ENDPOINT:-http://127.0.0.1:8333}
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: local-development-only
      LAKEFS_STATS_ENABLED: "false"
      LAKEFS_INSTALLATION_USER_NAME: admin
      LAKEFS_INSTALLATION_ACCESS_KEY_ID: ${LAKEFS_ACCESS_KEY_ID:-AKIAIOSFOLKFSSAMPLES}
      LAKEFS_INSTALLATION_SECRET_ACCESS_KEY: ${LAKEFS_SECRET_ACCESS_KEY:-wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY}
    ports:
      - "${LAKEFS_PORT:-8000}:8000"
    volumes:
      - lakefs-data:/home/lakefs/lakefs/metadata
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/_health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.4.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  seaweedfs-data:
  lakefs-data:
  mlflow-data:
